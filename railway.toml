# Railway deploy config for LifeOS.
# Single web service only — no worker, no cron. LifeOS is an end-user app,
# not an ingest/alert system (MrBrooks Admin Portal is the ingest path).
#
# Reference: docs/ARCHITECTURE.md ADR-001 (single-app topology).

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Postgres lives on Railway as a separate managed service. DATABASE_URL is
# set per-environment as a shared variable (not in this file).
